name: deploy

# On every merge to main: cut the basemap, build the site and keep it as a
# workflow artifact, and publish the draft to GitHub Pages: the library's own content, whose
# prototype plants are fixtures, so its pages carry a banner. The company copy
# publishes the real build to its internal web server (docs/workflow.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The basemap extract (scripts/basemap.ts) is published with the site, never
      # committed. It is cut from the newest Protomaps build once a week and cached;
      # if the cut fails, the site still deploys and the map draws without it (D42).
      - name: Week for the basemap cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the basemap extract
        id: basemap-cache
        uses: actions/cache@v4
        with:
          path: site/public/basemap
          key: basemap-${{ hashFiles('config/site.json', 'geo/states.topojson', 'scripts/basemap.ts') }}-${{ steps.week.outputs.week }}

      - name: Cut the basemap extract
        if: steps.basemap-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: npm run basemap

      - run: npm run build

      - name: Check the built site's links
        run: npm run links

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/dist
          retention-days: 30

  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The basemap extract (scripts/basemap.ts) is published with the site, never
      # committed. It is cut from the newest Protomaps build once a week and cached;
      # if the cut fails, the site still deploys and the map draws without it (D42).
      - name: Week for the basemap cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the basemap extract
        id: basemap-cache
        uses: actions/cache@v4
        with:
          path: site/public/basemap
          key: basemap-${{ hashFiles('config/site.json', 'geo/states.topojson', 'scripts/basemap.ts') }}-${{ steps.week.outputs.week }}

      - name: Cut the basemap extract
        if: steps.basemap-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: npm run basemap

      - run: npm run build

      - name: Check the built site's links
        run: npm run links

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v5
