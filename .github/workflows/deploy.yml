name: deploy

# On every merge to main: build the site and keep it as a workflow artifact,
# and publish the draft to GitHub Pages. Until the real fixture set exists,
# Pages shows the fixture build, whose pages carry a banner. The company copy
# publishes the real build to its internal web server (docs/workflow.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check the built site's links
        run: npm run links

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 30

  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build:fixtures

      - name: Check the built site's links
        run: npm run links

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
