version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      dev-tools:
        dependency-type: development
    commit-message:
      prefix: 'deps:'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci:'
